{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /docs
            pathType: Exact
            backend: { service: { name: {{ .Release.Name }}-api, port: { number: 8000 } } }
          - path: /v1
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-api, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-web, port: { number: 3000 } } }
{{- end }}
