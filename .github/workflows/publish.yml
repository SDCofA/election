name: Publish containers
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: services/api, file: services/api/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: pipeline, context: ., file: services/pipeline/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: SOURCE_SHA=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/elexion-${{ matrix.name }}:${{ github.ref_name }}
          provenance: true
          # Avoid stale base-package metadata during the subsequent Trivy scan.
          sbom: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/elexion-${{ matrix.name }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/elexion-${{ matrix.name }}@${{ steps.build.outputs.digest }}
