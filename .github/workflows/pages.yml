name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { enable-cache: true }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/api --locked
      - run: uv run --project services/api python services/api/scripts/export_static_site_data.py
      - name: Validate product identity
        run: |
          test -s apps/web/public/brand/elexion-logo.svg
          test -s apps/web/public/brand/elexion-logo-dark.svg
          grep -q 'elexion-logo-dark.svg' apps/web/components/forecast-dashboard.tsx
      - name: Configure GitHub Pages paths
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$repo_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base_path=""
          else
            base_path="/$repo_name"
          fi
          {
            echo "PAGES_BASE_PATH=$base_path"
            echo "NEXT_PUBLIC_BASE_PATH=$base_path"
            echo "NEXT_PUBLIC_SITE_URL=https://${owner}.github.io${base_path}"
          } >> "$GITHUB_ENV"
      - run: GITHUB_PAGES=true pnpm --filter @elexion/web build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
