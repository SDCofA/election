telemetry:
  enabled: false

storage:
  postgres:
    postgres_db:
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      hostname:
        env: POSTGRES_HOST
      db_name:
        env: POSTGRES_DB
      port: 5432

retention:
  schedule:
    purge_after_days: 90
  sensor:
    purge_after_days: 90
