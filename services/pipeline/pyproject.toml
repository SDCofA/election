[project]
name = "elexion-pipeline"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "dagster>=1.11,<2",
  "dagster-postgres>=0.27,<1",
  "dagster-webserver>=1.11,<2",
  "httpx>=0.28,<1",
  "nats-py>=2.11,<3",
  "numpy>=2.3,<3",
  "polars>=1.32,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pypdf>=5,<7",
  "pyreadr>=0.5,<1",
  "tenacity>=9.1,<10",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[project.entry-points]
dagster = { elexion = "elexion_pipeline.definitions:defs" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elexion_pipeline"]

[tool.hatch.build]
include = ["elexion_pipeline/config/*.json"]
