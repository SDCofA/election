[project]
name = "elexion-api"
version = "0.2.0"
description = "Election catalog and probabilistic forecast API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "nats-py>=2.11,<3",
  "numpy>=2.3,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-sdk>=1.38,<2",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.3,<4",
  "redis>=6,<8",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
